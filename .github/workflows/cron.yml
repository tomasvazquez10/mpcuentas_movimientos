name: Cron Movimientos Mercado Pago

on:
  schedule:
    # Se ejecuta todos los días a las 06:00 UTC (03:00 AM hora de Argentina)
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions cuando quieras probarlo

jobs:
  ejecutar-script:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas supabase

      - name: Ejecutar Script
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python cron_movimientos.py